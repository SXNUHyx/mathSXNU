<div class="question-files">{% for attachment in question.attachments.all %}<a class="question-file" href="{% url 'question_file' attachment.pk %}" target="_blank" rel="noopener">{% if attachment.is_image %}<img src="{% url 'question_file' attachment.pk %}" alt="{{ attachment.original_name }}" loading="lazy">{% endif %}<span>{{ attachment.original_name }} ↓</span></a>{% endfor %}</div>
