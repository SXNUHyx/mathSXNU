{% extends 'base.html' %}
{% block title %}账号身份提示 · 课堂信号{% endblock %}
{% block content %}<section class="panel narrow"><h1 class="page-title">{% if student_only %}请使用学生账号反馈{% else %}这里需要教师账号{% endif %}</h1><p class="muted">{% if student_only %}教师可以预览学生页面，但不能计入学生反馈。{% else %}学生账号可以加入课堂、提交和查看自己的反馈，不能管理课堂或读取班级统计。{% endif %}</p><a class="button primary full" href="{% if account_role == 'teacher' %}{% url 'teacher_home' %}{% else %}{% url 'student_home' %}{% endif %}">返回我的页面</a></section>{% endblock %}
